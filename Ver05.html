<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Hải Châu - Đặt Hàng</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#F5F3EE;--card:#FFF;--primary:#B8450A;--ph:#9A3A08;
  --pl:#FDF2EC;--text:#2D2016;--text2:#8C7E72;--border:#E8E2DA;
  --shadow:0 2px 8px rgba(45,32,22,0.06);--r:12px;
}
body{font-family:'Be Vietnam Pro',sans-serif;background:var(--bg);color:var(--text);
  min-height:100vh;-webkit-font-smoothing:antialiased;padding-bottom:68px}

.header{
  background:linear-gradient(145deg,#8B3A0F,#B8450A 40%,#D4600E);
  padding:12px 14px 14px;color:#fff;position:sticky;top:0;z-index:100;
  box-shadow:0 4px 24px rgba(139,58,15,0.3);transition:all .3s;
}
.header.mini{padding:8px 14px 10px}
.header.mini .h-row{margin-bottom:4px}
.header.mini .logo h1{font-size:15px}
.header.mini .logo-icon{width:28px;height:28px;font-size:16px}
.header.mini .info-section{display:none}
.h-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.logo{display:flex;align-items:center;gap:8px}
.logo-icon{width:34px;height:34px;background:rgba(255,255,255,0.15);border-radius:8px;
  display:flex;align-items:center;justify-content:center;font-size:18px;transition:all .3s}
.logo h1{font-size:17px;font-weight:800;transition:all .3s}
.logo-sub{font-size:10px;opacity:0.7;font-weight:500}
.date-b{background:rgba(255,255,255,0.12);padding:4px 10px;border-radius:6px;font-size:11px;font-weight:600}
.info-section{transition:all .3s}
.info-lbl{font-size:10px;opacity:0.6;margin-bottom:3px;display:block}
.info-row{display:flex;gap:6px;margin-bottom:6px}
.field{
  flex:1;padding:7px 10px;border:none;border-radius:8px;font-size:12px;
  font-family:inherit;background:rgba(255,255,255,0.12);color:#fff;
  outline:none;font-weight:500;border:1px solid rgba(255,255,255,0.1);
}
.field:focus{background:rgba(255,255,255,0.2)}
.field::placeholder{color:rgba(255,255,255,0.5)}
.field:disabled{opacity:0.85}
.expand-btn{display:none;font-size:10px;color:rgba(255,255,255,0.7);text-align:center;cursor:pointer;padding:2px}
.header.mini .expand-btn{display:block}

/* Tabs: Sản phẩm / Giỏ hàng */
.tab-bar{
  display:flex;position:sticky;top:0;z-index:95;background:var(--bg);
  border-bottom:2px solid var(--border);
}
.tab{
  flex:1;padding:10px;text-align:center;font-size:13px;font-weight:700;
  font-family:inherit;cursor:pointer;border:none;background:transparent;
  color:var(--text2);position:relative;transition:color .2s;
}
.tab.active{color:var(--primary)}
.tab.active::after{content:'';position:absolute;bottom:-2px;left:20%;right:20%;height:3px;
  background:var(--primary);border-radius:2px}
.tab .tab-badge{
  display:inline-flex;align-items:center;justify-content:center;
  background:var(--primary);color:#fff;font-size:10px;font-weight:700;
  min-width:18px;height:18px;border-radius:9px;padding:0 5px;margin-left:4px;
  vertical-align:middle;
}
.tab .tab-badge:empty{display:none}

/* Search + cats */
.filter-bar{padding:8px 12px 4px}
.search-box{
  display:flex;align-items:center;gap:6px;background:var(--card);
  border-radius:8px;padding:8px 10px;border:1.5px solid var(--border);margin-bottom:6px;
}
.search-box:focus-within{border-color:var(--primary)}
.search-box svg{flex-shrink:0;color:var(--text2);width:15px;height:15px}
.search-box input{border:none;outline:none;font-size:12px;font-family:inherit;
  flex:1;background:transparent;color:var(--text)}
.cats{display:flex;gap:5px;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:4px}
.cats::-webkit-scrollbar{display:none}
.cat-btn{
  padding:5px 12px;border-radius:16px;border:1.5px solid var(--border);
  background:var(--card);font-size:11px;font-weight:600;font-family:inherit;
  cursor:pointer;white-space:nowrap;color:var(--text2);position:relative;
}
.cat-btn .cc{position:absolute;top:-5px;right:-5px;background:var(--primary);color:#fff;
  font-size:8px;font-weight:700;min-width:14px;height:14px;border-radius:7px;
  display:none;align-items:center;justify-content:center;padding:0 3px}
.cat-btn .cc.show{display:flex}
.cat-btn.active{background:var(--primary);color:#fff;border-color:var(--primary)}
.cat-btn.active .cc{background:#fff;color:var(--primary)}

/* Products */
.pg{padding:2px 12px}
.gt{font-size:11px;font-weight:700;color:var(--text2);text-transform:uppercase;
  letter-spacing:.8px;padding:8px 0 4px;display:flex;align-items:center;gap:6px}
.gt::after{content:'';flex:1;height:1px;background:var(--border)}
.ps{display:flex;flex-direction:column;gap:5px;padding-bottom:4px}
.pc{
  background:var(--card);border-radius:10px;padding:8px 10px;
  box-shadow:var(--shadow);border:1.5px solid transparent;
  display:flex;align-items:center;gap:8px;
}
.pc.has-qty{border-color:var(--primary);background:var(--pl)}
.pc-img{width:44px;height:44px;border-radius:8px;object-fit:contain;
  background:#FAFAF7;flex-shrink:0;border:1px solid var(--border)}
.pc-img-ph{width:44px;height:44px;border-radius:8px;background:#F0EDE8;
  display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.pc-mid{flex:1;min-width:0}
.pc-name{font-size:12px;font-weight:600;line-height:1.3}
.pc-spec{font-size:10px;color:var(--text2);margin-top:1px}
.pc-right{display:flex;align-items:center;gap:4px;flex-shrink:0}
.u-tog{display:flex;flex-direction:column;gap:2px;flex-shrink:0}
.u-opt{
  padding:3px 8px;font-size:9px;font-weight:700;font-family:inherit;
  cursor:pointer;border:1px solid var(--border);background:var(--card);
  color:var(--text2);transition:all .15s;text-align:center;
}
.u-opt:first-child{border-radius:6px 6px 0 0}
.u-opt:last-child{border-radius:0 0 6px 6px}
.u-opt:only-child{border-radius:6px}
.u-opt.active{background:var(--primary);color:#fff;border-color:var(--primary)}
.qty-tap{
  min-width:40px;height:34px;border-radius:8px;border:1.5px solid var(--border);
  background:#fff;display:flex;align-items:center;justify-content:center;
  font-size:14px;font-weight:700;font-family:inherit;cursor:pointer;
  color:var(--text);transition:all .15s;padding:0 6px;
}
.qty-tap.has-val{border-color:var(--primary);color:var(--primary);background:var(--pl)}
.qty-tap:active{transform:scale(.95)}
.quick-btns{display:flex;gap:2px;flex-direction:column}
.qk{
  width:26px;height:16px;border-radius:4px;border:1px solid var(--border);
  background:var(--card);font-size:10px;font-weight:700;cursor:pointer;
  display:flex;align-items:center;justify-content:center;color:var(--text);font-family:inherit;
}
.qk:active{transform:scale(.9)}
.qk.plus{background:var(--primary);color:#fff;border-color:var(--primary)}
.qk.minus{color:#C62828}

/* ===== CART VIEW ===== */
.cart-view{display:none;padding:12px}
.cart-view.show{display:block}
.cart-header-card{
  background:var(--card);border-radius:10px;padding:12px;margin-bottom:8px;
  box-shadow:var(--shadow);
}
.cart-field-label{font-size:10px;font-weight:700;color:var(--text2);margin-bottom:3px;text-transform:uppercase;letter-spacing:.5px}
.cart-field-val{font-size:13px;font-weight:600;margin-bottom:8px;padding:6px 10px;background:var(--bg);border-radius:6px;min-height:28px;display:flex;align-items:center}
.cart-field-val:last-child{margin-bottom:0}
.cart-field-val.editable{cursor:pointer;border:1.5px dashed var(--border)}
.cart-note-input{
  width:100%;padding:8px 10px;border:1.5px solid var(--border);border-radius:8px;
  font-size:12px;font-family:inherit;outline:none;background:#fff;resize:none;min-height:36px;
}
.cart-note-input:focus{border-color:var(--primary)}

.cart-section-title{
  font-size:11px;font-weight:700;color:var(--text2);text-transform:uppercase;
  letter-spacing:.8px;padding:10px 0 6px;display:flex;align-items:center;gap:6px;
}
.cart-section-title::after{content:'';flex:1;height:1px;background:var(--border)}
.cart-item{
  background:var(--card);border-radius:10px;padding:10px;margin-bottom:5px;
  box-shadow:var(--shadow);display:flex;align-items:center;gap:8px;
  border-left:4px solid var(--primary);
}
.ci-img{width:40px;height:40px;border-radius:6px;object-fit:contain;background:#FAFAF7;flex-shrink:0}
.ci-info{flex:1;min-width:0}
.ci-name{font-size:12px;font-weight:600;line-height:1.3}
.ci-cat{font-size:10px;color:var(--text2)}
.ci-qty{
  font-size:15px;font-weight:800;color:var(--primary);
  display:flex;align-items:center;gap:4px;flex-shrink:0;
}
.ci-unit{font-size:10px;font-weight:600;color:var(--text2)}
.ci-del{
  width:28px;height:28px;border-radius:6px;border:1px solid #f0d0d0;
  background:#fef5f5;display:flex;align-items:center;justify-content:center;
  cursor:pointer;font-size:12px;flex-shrink:0;color:#C62828;
}
.ci-del:active{transform:scale(.9)}

.cart-summary{
  background:linear-gradient(135deg,var(--primary),var(--ph));
  border-radius:10px;padding:12px;color:#fff;margin-top:10px;
}
.cs-row{display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px;opacity:0.85}
.cs-row:last-child{margin-bottom:0}
.cs-total{font-size:16px;font-weight:800;opacity:1;border-top:1px solid rgba(255,255,255,0.2);padding-top:8px;margin-top:6px}

.cart-empty{text-align:center;padding:40px 20px;color:var(--text2)}
.cart-empty-icon{font-size:48px;margin-bottom:8px;display:block}

/* Bottom bar */
.bottom{
  position:fixed;bottom:0;left:0;right:0;background:var(--card);
  border-top:1px solid var(--border);padding:6px 12px;
  padding-bottom:max(6px,env(safe-area-inset-bottom));z-index:200;
  box-shadow:0 -4px 24px rgba(0,0,0,0.06);
}
.btn-row{display:flex;gap:6px}
.sub-btn{
  flex:1;padding:12px;border:none;border-radius:10px;
  background:linear-gradient(135deg,var(--primary),var(--ph));
  color:#fff;font-size:14px;font-weight:700;font-family:inherit;cursor:pointer;
}
.sub-btn:active{transform:scale(.98)}
.sub-btn:disabled{background:#C8C0B8;cursor:not-allowed}
.clr-btn{
  padding:12px 14px;border:1.5px solid var(--border);border-radius:10px;
  background:var(--card);font-size:12px;font-weight:600;font-family:inherit;
  cursor:pointer;color:var(--text2);
}

/* Numpad */
.numpad-overlay{
  position:fixed;inset:0;background:rgba(0,0,0,0.4);z-index:400;
  display:none;align-items:flex-end;justify-content:center;backdrop-filter:blur(2px);
}
.numpad-overlay.show{display:flex}
.numpad{
  background:var(--card);border-radius:20px 20px 0 0;width:100%;max-width:420px;
  padding:16px;padding-bottom:max(16px,env(safe-area-inset-bottom));
}
.np-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.np-title{font-size:12px;font-weight:700;flex:1;line-height:1.3}
.np-unit{font-size:11px;color:var(--text2);font-weight:600}
.np-display{font-size:36px;font-weight:800;text-align:center;padding:6px;color:var(--primary);min-height:48px}
.np-quick{display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap;justify-content:center}
.np-qk{
  padding:6px 14px;border-radius:8px;border:1.5px solid var(--border);
  background:var(--card);font-size:12px;font-weight:700;font-family:inherit;
  cursor:pointer;color:var(--text2);
}
.np-qk:active{background:var(--pl);border-color:var(--primary);color:var(--primary)}
.np-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:10px}
.np-btn{
  padding:12px;border-radius:10px;border:1.5px solid var(--border);
  background:var(--card);font-size:18px;font-weight:700;font-family:inherit;
  cursor:pointer;text-align:center;color:var(--text);
}
.np-btn:active{background:var(--bg);transform:scale(.97)}
.np-btn.del{font-size:14px;color:#C62828}
.np-actions{display:flex;gap:8px}
.np-actions button{
  flex:1;padding:11px;border-radius:10px;font-size:14px;font-weight:700;font-family:inherit;cursor:pointer;
}
.np-cancel{border:1.5px solid var(--border);background:var(--card);color:var(--text)}
.np-ok{border:none;background:var(--primary);color:#fff}

/* Modal */
.mo{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:300;
  display:none;align-items:center;justify-content:center;backdrop-filter:blur(4px);padding:16px}
.mo.show{display:flex}
.modal{background:var(--card);border-radius:16px;padding:18px;width:100%;
  max-width:400px;max-height:80vh;overflow-y:auto}
.modal h2{font-size:15px;font-weight:800;margin-bottom:4px}
.modal .sub{font-size:12px;color:var(--text2);margin-bottom:10px}
.mi-list{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}
.mi{display:flex;align-items:center;gap:8px;padding:6px 8px;background:var(--bg);border-radius:8px;font-size:11px}
.mi img{width:30px;height:30px;object-fit:contain;border-radius:6px;background:#fff}
.mi .mn{font-weight:600;flex:1}
.mi .mq{font-weight:700;color:var(--primary)}
.m-note{font-size:11px;color:var(--text2);padding:6px 10px;background:#FFF8E1;border-radius:8px;margin-bottom:10px}
.m-btns{display:flex;gap:8px}
.m-btns button{flex:1;padding:10px;border-radius:10px;font-size:13px;font-weight:700;font-family:inherit;cursor:pointer}
.m-cancel{border:1.5px solid var(--border);background:var(--card);color:var(--text)}
.m-ok{border:none;background:var(--primary);color:#fff}

.toast{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%) scale(.8);
  background:rgba(0,0,0,.88);color:#fff;padding:24px 36px;border-radius:16px;
  font-size:15px;font-weight:600;z-index:999;opacity:0;pointer-events:none;transition:all .3s;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
.toast-icon{font-size:44px;display:block;margin-bottom:8px}
.empty{text-align:center;padding:30px 16px;color:var(--text2);font-size:13px}
@media(min-width:500px){.ps{display:grid;grid-template-columns:1fr 1fr;gap:6px}}
</style>
</head>
<body>
<div class="header" id="header">
  <div class="h-row">
    <div class="logo"><div class="logo-icon">🏭</div>
      <div><h1>Hải Châu Order</h1><div class="logo-sub">Công ty CPTP Quốc Tế Hải Châu</div></div>
    </div>
    <div class="date-b" id="dateBadge"></div>
  </div>
  <div class="info-section" id="infoSection">
    <span class="info-lbl">👤 Người đặt hàng</span>
    <div class="info-row"><input type="text" class="field" id="ordererName" placeholder="Tên nhân viên"></div>
    <span class="info-lbl">🏪 Khách hàng / NPP</span>
    <div class="info-row" style="margin-bottom:0"><input type="text" class="field" id="customerName" placeholder="Nhập tên khách hàng..."></div>
  </div>
  <div class="expand-btn" onclick="toggleHeader()">▼ Mở thông tin</div>
</div>

<!-- Tab bar -->
<div class="tab-bar" id="tabBar">
  <button class="tab active" id="tabProducts" onclick="switchTab('products')">📋 Sản phẩm</button>
  <button class="tab" id="tabCart" onclick="switchTab('cart')">🛒 Giỏ hàng <span class="tab-badge" id="cartBadge"></span></button>
</div>

<!-- Products view -->
<div id="productsView">
  <div class="filter-bar">
    <div class="search-box">
      <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      <input type="text" id="searchInput" placeholder="Tìm sản phẩm..." oninput="onSearch()">
    </div>
    <div class="cats" id="cats"></div>
  </div>
  <div id="productContainer"></div>
</div>

<!-- Cart view -->
<div class="cart-view" id="cartView"></div>

<!-- Bottom -->
<div class="bottom" id="bottomBar">
  <div class="btn-row">
    <button class="clr-btn" onclick="clearAll()">Xóa hết</button>
    <button class="sub-btn" id="submitBtn" disabled onclick="switchTab('cart')">XEM GIỎ HÀNG (0)</button>
  </div>
</div>

<!-- Numpad -->
<div class="numpad-overlay" id="numpadOverlay" onclick="if(event.target===this)closeNumpad()">
  <div class="numpad">
    <div class="np-header"><div class="np-title" id="npTitle">Số lượng</div><div class="np-unit" id="npUnit"></div></div>
    <div class="np-display" id="npDisplay">0</div>
    <div class="np-quick">
      <button class="np-qk" onclick="npSet(5)">5</button><button class="np-qk" onclick="npSet(10)">10</button>
      <button class="np-qk" onclick="npSet(20)">20</button><button class="np-qk" onclick="npSet(30)">30</button>
      <button class="np-qk" onclick="npSet(50)">50</button><button class="np-qk" onclick="npSet(100)">100</button>
      <button class="np-qk" onclick="npSet(150)">150</button>
    </div>
    <div class="np-grid">
      <button class="np-btn" onclick="npDigit('1')">1</button><button class="np-btn" onclick="npDigit('2')">2</button>
      <button class="np-btn" onclick="npDigit('3')">3</button><button class="np-btn" onclick="npDigit('4')">4</button>
      <button class="np-btn" onclick="npDigit('5')">5</button><button class="np-btn" onclick="npDigit('6')">6</button>
      <button class="np-btn" onclick="npDigit('7')">7</button><button class="np-btn" onclick="npDigit('8')">8</button>
      <button class="np-btn" onclick="npDigit('9')">9</button><button class="np-btn del" onclick="npDel()">Xóa</button>
      <button class="np-btn" onclick="npDigit('0')">0</button><button class="np-btn del" onclick="npClear()">C</button>
    </div>
    <div class="np-actions">
      <button class="np-cancel" onclick="closeNumpad()">Hủy</button>
      <button class="np-ok" onclick="npConfirm()">Xác nhận</button>
    </div>
  </div>
</div>

<!-- Confirm modal -->
<div class="mo" id="confirmModal">
  <div class="modal">
    <h2>✅ Xác nhận gửi đơn?</h2>
    <div class="sub">Đơn hàng sẽ được gửi vào nhóm Telegram</div>
    <div class="m-btns">
      <button class="m-cancel" onclick="closeModal()">Quay lại</button>
      <button class="m-ok" onclick="confirmOrder()">Gửi ngay</button>
    </div>
  </div>
</div>

let cart={},selectedUnits={},activeCat='Tất cả',currentTab='products';
let npIdx=-1,npVal='';

function init(){
  document.getElementById('dateBadge').textContent=new Date().toLocaleDateString('vi-VN',{day:'2-digit',month:'2-digit',year:'numeric'});
  if(window.Telegram&&window.Telegram.WebApp){
    const tg=window.Telegram.WebApp;tg.ready();tg.expand();
    if(tg.initDataUnsafe&&tg.initDataUnsafe.user){
      const u=tg.initDataUnsafe.user;
      document.getElementById('ordererName').value=[u.first_name,u.last_name].filter(Boolean).join(' ');
    }
  }
  products.forEach((p,i)=>{selectedUnits[i]=p.units[0];});
  window.addEventListener('scroll',()=>{
    const h=document.getElementById('header');
    if(window.scrollY>80)h.classList.add('mini');else h.classList.remove('mini');
  },{passive:true});
  renderCats();renderProducts();
}
function toggleHeader(){document.getElementById('header').classList.remove('mini');window.scrollTo({top:0,behavior:'smooth'});}

// Tab switching
function switchTab(tab){
  currentTab=tab;
  document.getElementById('tabProducts').classList.toggle('active',tab==='products');
  document.getElementById('tabCart').classList.toggle('active',tab==='cart');
  document.getElementById('productsView').style.display=tab==='products'?'block':'none';
  document.getElementById('cartView').classList.toggle('show',tab==='cart');
  // Bottom bar button changes
  const btn=document.getElementById('submitBtn');
  if(tab==='cart'){
    btn.textContent='GỬI ĐƠN HÀNG';btn.onclick=function(){showConfirm()};
    renderCart();
  } else {
    updateSummary();
  }
}

function getCats(){return['Tất cả',...new Set(products.map(p=>p.cat))];}
function getCatCounts(){
  const c={};for(const[k,v] of Object.entries(cart)){if(v.qty>0){const p=products[+k];if(p)c[p.cat]=(c[p.cat]||0)+1;}}
  return c;
}
function renderCats(){
  const counts=getCatCounts(),tot=Object.values(counts).reduce((a,b)=>a+b,0);
  document.getElementById('cats').innerHTML=getCats().map(cat=>{
    const cnt=cat==='Tất cả'?tot:(counts[cat]||0);
    return`<button class="cat-btn ${cat===activeCat?'active':''}" onclick="setCat('${cat}')">${cat}<span class="cc ${cnt>0?'show':''}">${cnt}</span></button>`;
  }).join('');
}
function setCat(c){activeCat=c;renderCats();renderProducts();}
function onSearch(){renderProducts();}
function getImg(i){const b=IMG[i];return b?`<img class="pc-img" src="data:image/jpeg;base64,${b}">`:`<div class="pc-img-ph">📦</div>`;}

function renderProducts(){
  const c=document.getElementById('productContainer');
  const q=document.getElementById('searchInput').value.toLowerCase().trim();
  const cats=activeCat==='Tất cả'?[...new Set(products.map(p=>p.cat))]:[activeCat];
  let h='';
  for(const cat of cats){
    const items=products.map((p,i)=>({...p,idx:i})).filter(p=>p.cat===cat&&(!q||p.name.toLowerCase().includes(q)));
    if(!items.length) continue;
    h+=`<div class="pg"><div class="gt">${cat}</div><div class="ps">`;
    for(const p of items){
      const ci=cart[p.idx];const qty=ci?ci.qty:0;const su=selectedUnits[p.idx];
      let uH='';
      if(p.units.length>1){uH='<div class="u-tog">';for(const u of p.units)uH+=`<button class="u-opt ${su===u?'active':''}" onclick="setUnit(${p.idx},'${u}')">${u}</button>`;uH+='</div>';}
      else uH=`<div class="u-tog"><button class="u-opt active">${p.units[0]}</button></div>`;
      h+=`<div class="pc ${qty>0?'has-qty':''}">
        ${getImg(p.idx)}
        <div class="pc-mid"><div class="pc-name">${p.name}</div><div class="pc-spec" style="color:var(--primary);font-weight:700;font-size:10px">${p.sku}</div><div class="pc-spec">${p.spec}</div></div>
        <div class="pc-right">${uH}
          <div class="qty-tap ${qty>0?'has-val':''}" onclick="openNumpad(${p.idx})">${qty||'0'}</div>
          <div class="quick-btns"><button class="qk plus" onclick="chg(${p.idx},1)">+</button><button class="qk minus" onclick="chg(${p.idx},-1)">−</button></div>
        </div></div>`;
    }
    h+=`</div></div>`;
  }
  if(!h)h='<div class="empty">Không tìm thấy sản phẩm</div>';
  c.innerHTML=h;
}

// Cart view
function renderCart(){
  const cv=document.getElementById('cartView');
  const entries=Object.entries(cart).filter(([,v])=>v.qty>0);
  if(!entries.length){
    cv.innerHTML=`<div class="cart-empty"><span class="cart-empty-icon">🛒</span>Giỏ hàng trống<br><small style="color:var(--text2)">Quay lại tab Sản phẩm để chọn hàng</small></div>`;
    return;
  }
  const orderer=document.getElementById('ordererName').value.trim()||'N/A';
  const customer=document.getElementById('customerName').value.trim()||'Chưa nhập';

  let h=`<div class="cart-header-card">
    <div class="cart-field-label">👤 Người đặt hàng</div>
    <div class="cart-field-val">${orderer}</div>
    <div class="cart-field-label">🏪 Khách hàng / NPP</div>
    <div class="cart-field-val editable" onclick="document.getElementById('header').classList.remove('mini');switchTab('products');setTimeout(()=>document.getElementById('customerName').focus(),300)">${customer} ✏️</div>
    <div class="cart-field-label">📝 Ghi chú</div>
    <textarea class="cart-note-input" id="cartNote" placeholder="Nhập ghi chú (nếu có)..." oninput="syncNote(this.value)">${document.getElementById('cartNote')?.value||''}</textarea>
  </div>`;

  // Group by category
  const byCat={};
  entries.forEach(([idx,v])=>{const p=products[+idx];if(!byCat[p.cat])byCat[p.cat]=[];byCat[p.cat].push({idx:+idx,...v,p});});
  let totalItems=0,totalQty=0;
  for(const[cat,items] of Object.entries(byCat)){
    h+=`<div class="cart-section-title">${cat} (${items.length})</div>`;
    for(const it of items){
      const b=IMG[it.idx];
      totalItems++;totalQty+=it.qty;
      h+=`<div class="cart-item">
        ${b?`<img class="ci-img" src="data:image/jpeg;base64,${b}">`:''}
        <div class="ci-info"><div class="ci-name">${it.p.name}</div><div class="ci-cat"><b>${it.p.sku}</b> · ${it.p.spec}</div><div class="ci-cat">${it.p.spec}</div></div>
        <div class="ci-qty">${it.qty}<span class="ci-unit">${it.unit}</span></div>
        <div class="ci-del" onclick="removeItem(${it.idx})">✕</div>
      </div>`;
    }
  }

  h+=`<div class="cart-summary">
    <div class="cs-row"><span>Số sản phẩm</span><span>${totalItems}</span></div>
    <div class="cs-row"><span>Tổng số lượng</span><span>${totalQty}</span></div>
    <div class="cs-row"><span>Người đặt</span><span>${orderer}</span></div>
    <div class="cs-row"><span>Khách hàng</span><span>${customer}</span></div>
    <div class="cs-row cs-total"><span>TỔNG ĐƠN</span><span>${totalItems} SP · ${totalQty} đơn vị</span></div>
  </div>`;

  cv.innerHTML=h;
}

function syncNote(v){/* keep note in sync */}
function removeItem(idx){delete cart[idx];renderCart();updateSummary();renderCats();}

function setUnit(i,u){selectedUnits[i]=u;if(cart[i])cart[i].unit=u;renderProducts();}
function chg(i,d){
  const c=cart[i]||{qty:0,unit:selectedUnits[i]};
  c.qty=Math.max(0,c.qty+d);c.unit=selectedUnits[i];
  if(c.qty===0)delete cart[i];else cart[i]=c;
  renderProducts();renderCats();updateSummary();
}

function openNumpad(idx){
  npIdx=idx;const ci=cart[idx];npVal=ci?String(ci.qty):'';
  document.getElementById('npTitle').textContent=products[idx].name;
  document.getElementById('npUnit').textContent=selectedUnits[idx];
  document.getElementById('npDisplay').textContent=npVal||'0';
  document.getElementById('numpadOverlay').classList.add('show');
}
function closeNumpad(){document.getElementById('numpadOverlay').classList.remove('show');npIdx=-1;}
function npDigit(d){if(npVal.length>=4)return;if(npVal==='0')npVal='';npVal+=d;document.getElementById('npDisplay').textContent=npVal||'0';}
function npDel(){npVal=npVal.slice(0,-1);document.getElementById('npDisplay').textContent=npVal||'0';}
function npClear(){npVal='';document.getElementById('npDisplay').textContent='0';}
function npSet(v){npVal=String(v);document.getElementById('npDisplay').textContent=npVal;}
function npConfirm(){
  const n=parseInt(npVal)||0;
  if(n<=0)delete cart[npIdx];else cart[npIdx]={qty:n,unit:selectedUnits[npIdx]};
  closeNumpad();renderProducts();renderCats();updateSummary();
}

function updateSummary(){
  const e=Object.entries(cart),items=e.length,total=e.reduce((a,[,v])=>a+v.qty,0);
  const btn=document.getElementById('submitBtn');
  const badge=document.getElementById('cartBadge');
  badge.textContent=items>0?items:'';
  if(currentTab==='products'){
    btn.disabled=items===0;
    btn.textContent=items>0?`XEM GIỎ HÀNG (${items})`:'XEM GIỎ HÀNG (0)';
    btn.onclick=function(){switchTab('cart')};
  } else {
    btn.disabled=items===0;
    btn.textContent='GỬI ĐƠN HÀNG';
    btn.onclick=function(){showConfirm()};
  }
}

function clearAll(){cart={};renderProducts();renderCats();updateSummary();if(currentTab==='cart')renderCart();}

function showConfirm(){
  const cust=document.getElementById('customerName').value.trim();
  if(!cust){switchTab('products');setTimeout(()=>{
    document.getElementById('header').classList.remove('mini');
    const i=document.getElementById('customerName');i.focus();i.style.border='2px solid #C62828';
    setTimeout(()=>i.style.border='',2000);
  },200);return;}
  const entries=Object.entries(cart).filter(([,v])=>v.qty>0);if(!entries.length)return;
  document.getElementById('confirmModal').classList.add('show');
}
function closeModal(){document.getElementById('confirmModal').classList.remove('show');}

async function confirmOrder(){
  closeModal();
  const ord=document.getElementById('ordererName').value.trim()||'N/A';
  const cust=document.getElementById('customerName').value.trim();
  const noteEl=document.getElementById('cartNote');
  const note=noteEl?noteEl.value.trim():'';
  const entries=Object.entries(cart).filter(([,v])=>v.qty>0);
  const data={orderer:ord,customer:cust,time:new Date().toISOString(),note:note||'',
    items:entries.map(([i,v])=>{const p=products[+i];return{sku:p.sku,name:p.name,category:p.cat,quantity:v.qty,unit:v.unit};})
  };
  const btn=document.getElementById('submitBtn');btn.disabled=true;btn.textContent='Đang gửi...';
  try{
    const r=await fetch(WEBHOOK_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});
    if(!r.ok)throw new Error();
    showToast('Đặt hàng thành công!');
    cart={};if(noteEl)noteEl.value='';
    renderProducts();renderCats();updateSummary();renderCart();
    if(window.Telegram&&window.Telegram.WebApp)setTimeout(()=>window.Telegram.WebApp.close(),1500);
  }catch(e){showToast('Lỗi gửi đơn! Thử lại.');}
  finally{btn.disabled=false;btn.textContent='GỬI ĐƠN HÀNG';updateSummary();}
}
function showToast(m){const t=document.getElementById('toast');document.getElementById('toastMsg').textContent=m;
  t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200);}
init();
</script>
